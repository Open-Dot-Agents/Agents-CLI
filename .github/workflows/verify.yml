name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go tests and native coverage checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Open-Dot-Agents monorepo (for the shared .agents tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Open-Dot-Agents/Open-Dot-Agents
          path: monorepo
      - name: Checkout this CLI ref into monorepo/CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monorepo/CLI
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: monorepo/CLI/go.mod
          cache-dependency-path: monorepo/CLI/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Vet
        working-directory: monorepo/CLI
        run: go vet ./...
      - name: Test
        working-directory: monorepo/CLI
        run: go test ./...
      - name: Version command
        working-directory: monorepo/CLI
        run: go run ./cmd/agents version
      - name: Check compatibility data
        working-directory: monorepo/CLI
        run: python3 scripts/check_compatibility.py --skip-workbench-pins
      - name: Check native coverage classification and reproducibility
        working-directory: monorepo/CLI
        run: python3 scripts/native_coverage_test.py
      - name: Check pinned project skills and plugins
        working-directory: monorepo/CLI
        run: |
          python3 scripts/check_project_extensions.py
          python3 scripts/check_project_extensions_test.py
